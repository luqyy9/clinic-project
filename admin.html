<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOWClinicFinder - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">WOWClinicFinder</a>
    </div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="map.html" class="nav-link">Find Clinics</a>
      <a href="view.html" class="nav-link active">Clinic Admin Dashboard</a>
      <a href="cursor.html" class="nav-link">Interactive Demo</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu" type="button">
      <span class="bar top-bar"></span>
      <span class="bar middle-bar"></span>
      <span class="bar bottom-bar"></span>
    </button>
  </div>
</nav>

<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<h2>📋 My Appointment</h2>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search patient, doctor, clinic, or status">
</div>

<div class="card table-responsive">
  <table class="appointment-table" aria-label="Current Appointments List">
    <thead>
      <tr>
        <th scope="col">Patient Name</th>
        <th scope="col">Phone</th>
        <th scope="col">Clinic</th>
        <th scope="col">Doctor</th>
        <th scope="col">Date</th>
        <th scope="col">Time</th>
        <th scope="col">Status</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody"></tbody>
  </table>
</div>

<a href="index.html" class="btn">Back Home</a>

<script>
  const bookings = JSON.parse(localStorage.getItem("bookingList")) || [];
  const tableBody = document.getElementById("bookingTableBody");

function displayBookings(filteredBookings) {

  if (filteredBookings.length === 0) {

    tableBody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align:center; padding:14px;">
          No appointments found.
        </td>
      </tr>
    `;

  } else {

    tableBody.innerHTML = filteredBookings.map((data, index) => `
      <tr>
        <td>
          <strong>${data.name || 'N/A'}</strong>
          <br>
          <small>IC: ${data.icNumber || 'N/A'}</small>
        </td>

        <td>${data.phone || 'N/A'}</td>

        <td>${data.clinic || data.clinicName || 'N/A'}</td>

        <td>
          <img 
            src="${data.doctorImage || 'image/default.jpg'}"
            alt="Doctor Image"
            style="
              width:60px;
              height:60px;
              object-fit:cover;
              border-radius:50%;
              margin-bottom:8px;
            "
          >
          <br>
          <strong>${data.doctorType || data.doctor || 'N/A'}</strong>
          <br>
          <small>${data.doctorName || data.doctor || ''}</small>
        </td>

        <td>${data.date || 'N/A'}</td>

        <td>${data.time || 'N/A'}</td>
        <td class="status-${(data.status || 'Pending').toLowerCase()}">
  ${data.status || 'Pending'}
</td>
<td>

  <button onclick="approveBooking(${index})"
    class="btn"
    style="background:green; padding:6px 12px; font-size:12px; margin-bottom:4px;">

    Approve
  </button>

  <button onclick="rejectBooking(${index})"
    class="btn"
    style="background:orange; padding:6px 12px; font-size:12px; margin-bottom:4px;">

    Reject
  </button>

  <button onclick="deleteBooking(${index})"
    class="btn"
    style="background:red; padding:6px 12px; font-size:12px;">

    Delete
  </button>

</td>
 

      </tr>
    `).join('');
  }
}

displayBookings(bookings);
const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", () => {

  const value = searchInput.value.toLowerCase();

  const filteredBookings = bookings.filter(data =>

    (data.name || '').toLowerCase().includes(value) ||

    (data.doctor || '').toLowerCase().includes(value) ||

    (data.doctorName || '').toLowerCase().includes(value) ||

    (data.clinic || '').toLowerCase().includes(value) ||

    (data.status || '').toLowerCase().includes(value)
  );

  displayBookings(filteredBookings);
});
  function approveBooking(index) {
  let bookings = JSON.parse(localStorage.getItem("bookingList")) || [];

  bookings[index].status = "Approved";

  localStorage.setItem("bookingList", JSON.stringify(bookings));

  emailjs.send('service_v3ot97g', 'template_5uq33qr', {
    user_name: bookings[index].name,
    clinic_name: bookings[index].clinic || bookings[index].clinicName || '',
    doctor_type: bookings[index].doctorType || bookings[index].doctor || '',
    doctor_name: bookings[index].doctorName || bookings[index].doctor || '',
    booking_date: bookings[index].date,
    booking_time: bookings[index].time,
    user_email: bookings[index].email,
    status: 'Approved'
  }).then(() => {
    alert("Booking approved and email sent!");
    location.reload();
  }).catch((error) => {
    console.error(error);
    alert("Booking approved but email failed.");
    location.reload();
  });
}
function rejectBooking(index) {

  let bookings = JSON.parse(localStorage.getItem("bookingList")) || [];

  bookings[index].status = "Rejected";

  localStorage.setItem("bookingList", JSON.stringify(bookings));

  emailjs.send('service_v3ot97g', 'template_5uq33qr', {

    user_name: bookings[index].name,

    clinic_name: bookings[index].clinic || bookings[index].clinicName || '',

    doctor_type: bookings[index].doctorType || bookings[index].doctor || '',

    doctor_name: bookings[index].doctorName || bookings[index].doctor || '',

    booking_date: bookings[index].date,

    booking_time: bookings[index].time,

    user_email: bookings[index].email,

    status: 'Rejected'

  }).then(() => {

    alert("Booking rejected and email sent!");

    location.reload();

  }).catch((error) => {

    console.error(error);

    alert("Booking rejected but email failed.");

    location.reload();
  });
}
</script>

<!-- Navigation Script -->
<script>
  // Mobile menu toggle functionality
  document.addEventListener('DOMContentLoaded', function() {
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');

    if (navToggle && navMenu) {
      function updateNavExpanded() {
        const isExpanded = navMenu.classList.contains('active');
        navToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      }

      navToggle.addEventListener('click', function() {
        navToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
        updateNavExpanded();
      });

      // Close mobile menu when clicking on a link
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
          updateNavExpanded();
        });
      });

      // Close mobile menu when clicking outside
      document.addEventListener('click', function(event) {
        if (!navToggle.contains(event.target) && !navMenu.contains(event.target)) {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
        }
      });
    }
  });
</script>

<script type="module" src="js.script/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init('EFNQAwKhe4o6pyY0Z');
</script>
</body>
</html>
