<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<h2>📋 My Appointment</h2>

<div class="card table-responsive">
  <table class="appointment-table" aria-label="Current Appointments List">
    <thead>
      <tr>
        <th scope="col">Patient Name</th>
        <th scope="col">Phone</th>
        <th scope="col">Clinic</th>
        <th scope="col">Doctor</th>
        <th scope="col">Date</th>
        <th scope="col">Time</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody"></tbody>
  </table>
</div>

<a href="index.html" class="btn">Back Home</a>

<script>
  const bookings = JSON.parse(localStorage.getItem("bookingList")) || [];
  const tableBody = document.getElementById("bookingTableBody");

  if (bookings.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:14px;">No appointments found.</td></tr>`;
  } else {
    tableBody.innerHTML = bookings.map((data, index) => `
      <tr>
        <td><strong>${data.name || 'N/A'}</strong><br><small>IC: ${data.icNumber || 'N/A'}</small></td>
        <td>${data.phone || 'N/A'}</td>
        <td>${data.clinic || data.clinicName || 'N/A'}</td>
        <td><strong>${data.doctorType || data.doctor || 'N/A'}</strong><br><small>${data.doctorName || data.doctor || ''}</small></td>
        <td>${data.date || 'N/A'}</td>
        <td>${data.time || 'N/A'}</td>
        <td>
          <button onclick="deleteBooking(${index})" class="btn" style="background:red; padding:6px 12px; font-size:12px;">Delete</button>
        </td>
      </tr>
    `).join('');
  }
function approveBooking(index) {
  let bookings = JSON.parse(localStorage.getItem("bookingList")) || [];

  bookings[index].status = "Approved";

  localStorage.setItem("bookingList", JSON.stringify(bookings));

  emailjs.send('service_v3ot97g', 'template_5uq33qr', {
    user_name: bookings[index].name,
    clinic_name: bookings[index].clinic,
    doctor_type: bookings[index].doctorType,
    doctor_name: bookings[index].doctorName,
    booking_date: bookings[index].date,
    booking_time: bookings[index].time,
    user_email: bookings[index].email,
    status: 'Approved'
  }).then(() => {
    alert("Booking approved and email sent!");
    location.reload();
  }).catch((error) => {
    console.error(error);
    alert("Booking approved but email failed.");
    location.reload();
  });
}
  function deleteBooking(index) {
    let bookings = JSON.parse(localStorage.getItem("bookingList")) || [];
    bookings.splice(index, 1);
    localStorage.setItem("bookingList", JSON.stringify(bookings));
    location.reload();
  }
</script>

<script type="module" src="js.script/script.js"></script>

<script>
emailjs.init('EFNQAwKhe4o6pyY0Z');
</script>
