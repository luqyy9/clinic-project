<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">WOWClinicFinder</a>
    </div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="map.html" class="nav-link">Find Clinics</a>
      <a href="view.html" class="nav-link">My Bookings</a>
      <a href="admin.html" class="nav-link">Admin Panel</a>
      <a href="cursor.html" class="nav-link">Interactive Demo</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu" type="button">
      <span class="bar top-bar"></span>
      <span class="bar middle-bar"></span>
      <span class="bar bottom-bar"></span>
    </button>
  </div>
</nav>

<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<h2>✅ Appointment Confirmed</h2>

<div class="card">
  <p id="details"></p>
</div>

<p id="emailStatus" style="text-align:center; margin-top:12px; font-size:14px; color:gray;">
  Sending confirmation email...
</p>

<a id="whatsappBtn" class="btn" target="_blank" style="display:block; margin:15px auto; width:fit-content;">
  Contact via WhatsApp
</a>

<a href="index.html" class="btn">Back to Home</a>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js.script/confirm.js"></script>
<script type="module" src="js.script/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');

    if (navToggle && navMenu) {
      function updateNavExpanded() {
        const isExpanded = navMenu.classList.contains('active');
        navToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      }

      navToggle.addEventListener('click', function() {
        navToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
        updateNavExpanded();
      });

      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
          updateNavExpanded();
        });
      });

      document.addEventListener('click', function(event) {
        if (!navToggle.contains(event.target) && !navMenu.contains(event.target)) {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
          updateNavExpanded();
        }
      });
    }
  });
</script>
<p class="feature-note">
  📧 Automatic email confirmation will be sent after booking.
</p>
</body>
</html>
