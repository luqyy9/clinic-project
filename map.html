<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">WOWClinicFinder</a>
    </div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="map.html" class="nav-link active">Find Clinics</a>
      <a href="view.html" class="nav-link">My Bookings</a>
      <a href="cursor.html" class="nav-link">Interactive Demo</a>
    </div>
    <button id="grayscaleToggle" class="grayscale-toggle" type="button" aria-pressed="false">Grayscale</button>
    <button class="nav-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu" type="button">
      <span class="bar top-bar"></span>
      <span class="bar middle-bar"></span>
      <span class="bar bottom-bar"></span>
    </button>
  </div>
</nav>

<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<section class="map-section">
  <div class="map-frame">
    <div id="map"></div>
    <input id="search" type="search" placeholder="Search clinics..." list="clinic-suggestions">
  </div>
</section>

<datalist id="clinic-suggestions">
  <option value="Clinic Tuah">
  <option value="Cosmetic clinic Whooper">
  <option value="Dental Clinic Amru">
  <option value="kids clinic ISka">
</datalist>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="js.script/nav.js"></script>

<script>
  let clinics = [
  { name: "Clinic Tuah", lat: 3.8356432408130274, lng: 103.30245453670729, specialty: "Family Medicine", tagline: "Reliable general care for all ages.", description: "A trusted neighborhood clinic offering comprehensive family health services, wellness screening, and follow-up care.", hours: "24 hours opened" },
  { name: "Cosmetic clinic Whooper", lat: 3.8151244897534364, lng: 103.32772948692494, specialty: "Dermatology & Aesthetic", tagline: "Beauty treatments with clinical expertise.", description: "Specialized cosmetic care including laser therapies, skin rejuvenation, and personalized consultation for a confident appearance.", hours: "9am - 8pm" },
  { name: "Dental Clinic Amru", lat: 3.7096273738685657,  lng: 103.10816168159545, specialty: "Dental Care", tagline: "Modern dentistry in a comfortable setting.", description: "Advanced cosmetic and restorative dentistry with gentle treatment, tooth whitening, and comprehensive oral hygiene plans.", hours: "10am - 8.30pm" },
  { name: "kids clinic ISka", lat: 3.839273085930105, lng: 103.32888105301126, specialty: "Pediatric Care", tagline: "Compassionate care for little patients.", description: "Child-friendly medical services that support growth, vaccinations, and specialist referrals in a welcoming environment.", hours: "9am - 9pm" }
];

let markers = [];

// Initialize the map
let map = L.map('map').setView([3.81, 103.32], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// function to display clinics
function showClinics(list) {
  // remove old markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  list.forEach(clinic => {
    let marker = L.marker([clinic.lat, clinic.lng])
      .addTo(map)
      .bindTooltip(clinic.name)
      .bindPopup(`
        <div class="clinic-popup">
          <div class="clinic-popup-header">
            <div>
              <strong class="clinic-popup-title">${clinic.name}</strong>
              <span class="clinic-popup-subtitle">${clinic.tagline}</span>
            </div>
            <span class="clinic-popup-badge">${clinic.specialty}</span>
          </div>
          <p class="clinic-popup-description">${clinic.description}</p>
          <div class="clinic-popup-info">
            <span>🕒 <strong>Hours</strong>: ${clinic.hours}</span>
            <span>📍 <strong>Area</strong>: Kuantan</span>
          </div>
          <button class="clinic-popup-button" onclick="bookClinic('${clinic.name}')">Book Appointment</button>
        </div>
      `);

    markers.push(marker);
  });
}

// first load
showClinics(clinics);

// search function
document.getElementById("search").addEventListener("keyup", function() {
  let keyword = this.value.toLowerCase();

  let filtered = clinics.filter(c =>
    c.name.toLowerCase().startsWith(keyword)
  );

  showClinics(filtered);
});

// Function to handle booking
function bookClinic(clinicName) {
  localStorage.setItem('selectedClinic', clinicName);
  window.location.href = 'booking.html';
}
</script>

<script type="module" src="script.js"></script>
  <script src="js.script/grayscale-toggle.js"></script>

</html>
