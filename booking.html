<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">WOWClinicFinder</a>
    </div>
    <div class="nav-menu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="map.html" class="nav-link">Find Clinics</a>
      <a href="view.html" class="nav-link">My Bookings</a>
      <a href="cursor.html" class="nav-link">Interactive Demo</a>
    </div>
    <div class="nav-toggle">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
  </div>
</nav>

<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<h2 id="clinicName"></h2>

<form class="form">
  <input type="text" id="userName" placeholder="Your Name" required>
  <input type="text" id="userPhone" placeholder="Phone Number" required>
  <input type="text" id="userIC" placeholder="Your IC number without (-)" required>
  <input type="email" id="userEmail" placeholder="Your Email Address" required>
  
  <label for="doctorType">Doctor Type:</label>
  <select id="doctorType" required>
    <option value="">-- Select Doctor Type --</option>
  </select>
  
  <label for="doctorName">Doctor Name:</label>
  <p id="doctorName" style="background:#f0f0f0; padding:8px; border-radius:4px;">-- Select a doctor type --</p>
  
  <label for="painDescription">Describe Your Pain/Symptoms:</label>
  <textarea id="painDescription" placeholder="Please describe your pain, symptoms, or health concerns in detail..." rows="5" required></textarea>
  
  <input type="date" id="bookingDate" required>
  <input type="time" id="bookingTime" required>
  <button type="submit">Confirm Booking</button>
</form>

<script src="booking.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
