<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">WOWClinicFinder</a>
    </div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="map.html" class="nav-link">Find Clinics</a>
      <a href="booking.html" class="nav-link">Booking</a>
      <a href="view.html" class="nav-link">My Bookings</a>
      <a href="cursor.html" class="nav-link">Interactive Demo</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu" type="button">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<!-- Particle Trail Container -->
<div class="bubbly-particle-trail">
  <div class="particles"></div>
</div>

<section class="doctor-profile-section">
  <div class="doctor-profile">
    <img id="doctorImage" src="https://via.placeholder.com/200" alt="Doctor Image">
    <div class="doctor-info">
      <h1 id="doctorName">Doctor Name</h1>
      <p id="doctorSpecialty" class="specialty">Specialty</p>
      <p id="doctorHospital" class="hospital">Hospital</p>
      <p id="doctorQualifications" class="qualifications">Qualifications</p>
      <div class="doctor-actions">
        <button class="contact-btn">Contact</button>
        <button class="appointment-btn">Book Appointment</button>
      </div>
    </div>
  </div>
  <div class="doctor-details">
    <h2>About</h2>
    <p id="doctorAbout">Detailed information about the doctor...</p>
  </div>
</section>

<script src="js.script/doctor-profile.js"></script>
<script type="module" src="js.script/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');

    if (navToggle && navMenu) {
      function updateNavExpanded() {
        const isExpanded = navMenu.classList.contains('active');
        navToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      }

      navToggle.addEventListener('click', function() {
        navToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
        updateNavExpanded();
      });

      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
          updateNavExpanded();
        });
      });

      document.addEventListener('click', function(event) {
        if (!navToggle.contains(event.target) && !navMenu.contains(event.target)) {
          navToggle.classList.remove('active');
          navMenu.classList.remove('active');
          updateNavExpanded();
        }
      });
    }
  });
</script>
</body>
</html>
